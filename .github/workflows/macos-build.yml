      - 'settings_mac.py'
      - 'settings_window.py'
      - 'settings_view.py'
      - 'ui_motion.py'
      - 'launchers.py'
      - 'test_settings_mac.py'
      - 'test_claude.py'
      - 'test_claude_status.py'
      - 'test_features.py'
      - 'test_model_iq.py'
      - '.github/workflows/macos-build.yml'
  pull_request:
    paths:
      - 'mac_menu.py'
      - 'app_identity.py'
      - 'assets/circlow-fox-tray-mascot.icns'
      - 'test_app_identity.py'
      - 'sync_hub.py'
      - 'usage_store.py'
      - 'build-macos.sh'
      - 'requirements-macos.txt'
      - 'cli_usage.py'
      - 'cli_quota.py'
      - 'quota_sources.py'
      - 'tps_sources.py'
      - 'process_jail.py'
      - 'providers.py'
      - 'icon_art.py'
      - 'mimo_usage.py'
      - 'test_mimo.py'
      - 'tray_icons.py'
      - 'herdr_source.py'
      - 'agent_panel.py'
      - 'detail_card.py'
      - 'forecast.py'
      - 'refresh_scheduler.py'
      - 'claude_status.py'
      - 'model_iq.py'
      - 'test_mac_menu.py'
      - 'mac_panel.py'
      - 'mac_notify.py'
      - 'tray_app.py'
      - 'tray_slots.py'
      - 'local_sync.py'
      - 'quota_charts.py'
      - 'test_mac_panel.py'
      - 'test_mac_notify.py'
      - 'settings_mac.py'
      - 'settings_window.py'
      - 'settings_view.py'
      - 'ui_motion.py'
      - 'launchers.py'
      - 'test_settings_mac.py'
      - 'test_claude.py'
      - 'test_claude_status.py'
      - 'test_features.py'
      - 'test_model_iq.py'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test
        run: bash build-macos.sh
      - name: Check bundle metadata
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist-macos/Circlow.app/Contents/Info.plist)" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' dist-macos/Circlow.app/Contents/Info.plist)" = 环流
          file dist-macos/Circlow.app/Contents/MacOS/Circlow
          dist-macos/Circlow.app/Contents/MacOS/Circlow --smoke-menu
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist-macos/Circlow.app "Circlow-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Circlow-macos-${{ matrix.arch }}
          path: Circlow-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
